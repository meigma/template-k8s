name: Security Scan

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.14
          cache: true

      - name: Build local scan image (melange + apko)
        run: |
          set -euo pipefail
          melange keygen melange.rsa
          melange build melange.yaml --arch amd64 --runner docker \
            --signing-key melange.rsa --source-dir .
          apko build apko.yaml template-k8s:security-scan scan.tar \
            --arch amd64 --keyring-append ./melange.rsa.pub
          docker load < scan.tar
          docker tag template-k8s:security-scan-amd64 template-k8s:security-scan

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: template-k8s:security-scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          hide-progress: true
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          sarif_file: trivy-results.sarif
          category: container-vulnerability-scan
