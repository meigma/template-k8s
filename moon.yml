language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'template-k8s'
  description: 'Meigma Kubernetes operator repository template.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

fileGroups:
  goSources:
    - 'api/**/*.go'
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'test/**/*.go'
    - 'go.mod'
    - 'go.sum'
  kubebuilderSources:
    - 'api/**/*.go'
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'PROJECT'
    - 'go.mod'
    - 'go.sum'
  controllerGenTooling:
    - '.prototools'
    - '.moon/proto/controller-gen.toml'
  chainsawSources:
    - 'test/chainsaw/**/*.yaml'
    - 'config/**/*.yaml'
    - 'Dockerfile'
  chainsawTooling:
    - '.prototools'
    - '.moon/proto/chainsaw.toml'
  envtestTooling:
    - '.prototools'
    - '.moon/proto/setup-envtest.toml'
  lintConfig:
    - '.golangci.yml'
    - '.custom-gcl.yml'
    - '.prototools'
    - '.moon/proto/golangci-lint.toml'

workspace:
  inheritedTasks:
    include: []

tasks:
  manifests:
    command: 'controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases'
    inputs:
      - '@group(kubebuilderSources)'
      - '@group(controllerGenTooling)'
    outputs:
      - 'config/crd/bases/**/*'
      - 'config/rbac/role.yaml'
    options:
      cache: false

  generate:
    command: 'controller-gen object paths="./..."'
    inputs:
      - '@group(kubebuilderSources)'
      - '@group(controllerGenTooling)'
    outputs:
      - 'api/**/zz_generated.deepcopy.go'
    options:
      cache: false

  fmt:
    command: 'go fmt ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  vet:
    command: 'go vet ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  test:
    script: |
      set -euo pipefail
      KUBEBUILDER_ASSETS="$(setup-envtest use 1.35.x -p path)" go test ./...
    deps:
      - 'root:manifests'
      - 'root:generate'
    inputs:
      - '@group(goSources)'
      - '@group(kubebuilderSources)'
      - '@group(envtestTooling)'
      - 'config/crd/bases/**/*'
    options:
      cache: false
      runDepsInParallel: false

  lint-tool:
    command: 'bash -c ''mkdir -p bin && if [ -f .custom-gcl.yml ]; then rm -f bin/golangci-lint bin/golangci-lint-custom && golangci-lint custom --destination bin --name golangci-lint-custom && mv -f bin/golangci-lint-custom bin/golangci-lint; else ln -sf "$(command -v golangci-lint)" bin/golangci-lint; fi'''
    inputs:
      - '@group(lintConfig)'
    outputs:
      - 'bin/golangci-lint'

  lint:
    command: 'bin/golangci-lint run'
    deps:
      - 'root:lint-tool'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint-fix:
    command: 'bin/golangci-lint run --fix'
    deps:
      - 'root:lint-tool'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false
      runInCI: false

  lint-config:
    command: 'bin/golangci-lint config verify'
    deps:
      - 'root:lint-tool'
    inputs:
      - '@group(lintConfig)'
    options:
      cache: false

  chainsaw-lint:
    script: |
      set -euo pipefail
      chainsaw lint configuration --file test/chainsaw/chainsaw-config.yaml
      find test/chainsaw -name chainsaw-test.yaml -print | while IFS= read -r test_file; do
        chainsaw lint test --file "$test_file"
      done
    inputs:
      - '@group(chainsawSources)'
      - '@group(chainsawTooling)'
    options:
      cache: false

  build:
    command: 'go build -o bin/manager ./cmd'
    deps:
      - 'root:manifests'
      - 'root:generate'
      - 'root:fmt'
      - 'root:vet'
    inputs:
      - '@group(goSources)'
    outputs:
      - 'bin/manager'
    options:
      runDepsInParallel: false

  run:
    command: 'go run ./cmd'
    deps:
      - 'root:manifests'
      - 'root:generate'
      - 'root:fmt'
      - 'root:vet'
    inputs:
      - '@group(goSources)'
    options:
      cache: false
      runDepsInParallel: false
      runInCI: false

  docker-build:
    command: 'bash -c ''docker build -t "${IMG:-controller:latest}" .'''
    inputs:
      - 'Dockerfile'
      - '@group(goSources)'
    options:
      cache: false
      runInCI: false

  install:
    command: 'kubectl apply -k config/crd'
    deps:
      - 'root:manifests'
    inputs:
      - 'config/crd/**/*'
    options:
      cache: false
      runInCI: false

  uninstall:
    command: 'kubectl delete --ignore-not-found=true -k config/crd'
    deps:
      - 'root:manifests'
    inputs:
      - 'config/crd/**/*'
    options:
      cache: false
      runInCI: false

  deploy:
    script: |
      kubectl apply -k config/default
      kubectl set image deployment/template-k8s-controller-manager manager="${IMG:-controller:latest}" -n template-k8s-system
      if [ "${LOCAL_IMAGE:-false}" = "true" ]; then
        kubectl patch deployment/template-k8s-controller-manager -n template-k8s-system --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"manager","imagePullPolicy":"IfNotPresent"}]}}}}'
      fi
    deps:
      - 'root:manifests'
    inputs:
      - 'config/**/*'
    options:
      cache: false
      runInCI: false

  undeploy:
    command: 'kubectl delete --ignore-not-found=true -k config/default'
    inputs:
      - 'config/**/*'
    options:
      cache: false
      runInCI: false

  test-e2e:
    script: |
      set -euo pipefail
      kind_bin="${KIND:-kind}"
      command -v "$kind_bin" >/dev/null
      cluster="${KIND_CLUSTER:-template-k8s-test-e2e}"
      manager_image="${IMG:-example.com/template-k8s:v0.0.1}"
      kubeconfig_dir="$(mktemp -d)"
      kubeconfig="$kubeconfig_dir/kubeconfig"
      created=0
      cleanup() {
        status="$?"
        if [ "$created" -eq 1 ]; then
          "$kind_bin" delete cluster --name "$cluster"
        fi
        rm -rf "$kubeconfig_dir"
        exit "$status"
      }
      trap cleanup EXIT
      if "$kind_bin" get clusters | grep -qx "$cluster"; then
        echo "Using existing Kind cluster $cluster"
      else
        created=1
        "$kind_bin" create cluster --name "$cluster"
      fi
      "$kind_bin" export kubeconfig --name "$cluster" --kubeconfig "$kubeconfig"
      export KUBECONFIG="$kubeconfig"
      IMG="$manager_image" moon run root:docker-build
      "$kind_bin" load docker-image "$manager_image" --name "$cluster"
      KIND="$kind_bin" KIND_CLUSTER="$cluster" IMG="$manager_image" KUBECTL_KUBERC="${KUBECTL_KUBERC:-false}" \
        chainsaw test --config test/chainsaw/chainsaw-config.yaml test/chainsaw
    deps:
      - 'root:manifests'
      - 'root:generate'
      - 'root:fmt'
      - 'root:vet'
    inputs:
      - '@group(goSources)'
      - '@group(chainsawSources)'
      - '@group(chainsawTooling)'
    options:
      cache: false
      runDepsInParallel: false
      runInCI: false
