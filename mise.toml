# mise: tool + environment management for template-k8s.
#
# mise REPLACES Proto (the former .prototools + .moon/proto/*) and the .envrc
# direnv shim activation. The committed mise.lock records per-platform download
# URLs + checksums; for aqua-backed tools it additionally carries cosign / SLSA /
# GitHub-attestation verification. `settings.locked` makes `mise install` FAIL
# CLOSED when a tool lacks a pre-resolved URL for the current platform.
#
# moon stays the task runner / CI gate; it is configured (.moon/toolchains.yml +
# moon.yml `toolchains.default: system`) to run these tools as `system` binaries
# that mise puts on PATH.
#
# Bump a tool: edit its version here, then
#   mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
# and commit mise.toml + mise.lock together.

[tools]
# Language runtime (core backend). Authoritative, and matches go.mod's `go 1.26.3`.
go = "1.26.3"

# Task runner / CI gate. moon itself is now mise-managed (CI installs it via mise
# instead of moonrepo/setup-toolchain).
"aqua:moonrepo/moon" = "2.3.5"

# Go dev-tool CLIs. Explicit `aqua:` refs force the VERIFYING backend (checksum +
# cosign/SLSA/GitHub-attestation recorded in mise.lock); they must never fall back
# to a version-only backend (asdf), which records no checksum.
"aqua:golangci/golangci-lint" = "2.11.4"

# Kubebuilder operator toolchain.
"aqua:kubernetes-sigs/kubebuilder"                     = "4.14.0"
"aqua:kubernetes-sigs/controller-runtime/setup-envtest" = "0.24.1"
"aqua:kubernetes/kubernetes/kubectl"                   = "1.35.5"
"aqua:helm/helm"                                       = "4.0.4"
"aqua:kyverno/chainsaw"                                = "0.2.15"

# controller-gen ships no aqua package; the Go backend is its canonical install
# (`go install sigs.k8s.io/controller-tools/cmd/controller-gen`) and yields a
# correctly named `controller-gen` binary. Integrity is the Go checksum database.
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.21.0"

# Local dev stack (ko + Tilt + ctlptl + kind) behind `moon run dev-up`.
"aqua:ko-build/ko"      = "0.18.1"
"aqua:tilt-dev/tilt"    = "0.37.3"
"aqua:tilt-dev/ctlptl"  = "0.9.3"
"aqua:kubernetes-sigs/kind" = "0.31.0"

# Supply-chain / container build CLIs. melange + apko build and sign the release
# operator image; cosign is used for keyless image signing in the release
# workflow. Pinned here now so the toolset is locked in one place.
"aqua:chainguard-dev/melange" = "0.54.0"
"aqua:chainguard-dev/apko"    = "1.2.19"
"aqua:sigstore/cosign"        = "3.1.1"

[env]
# Pin the Go toolchain: never auto-download a toolchain other than the one above.
# The version here is authoritative and matches go.mod's `go 1.26.3`.
GOTOOLCHAIN = "local"

[settings]
# Read/write mise.lock, and fail closed if a tool lacks a pre-resolved URL for the
# current platform — replaces Proto's `checksum-url` pins and extends integrity
# enforcement to every aqua-backed tool.
lockfile = true
locked = true
